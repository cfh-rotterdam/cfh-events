<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0C;--s1:#141417;--s2:#1B1B1F;--s3:#232328;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --t1:#FAFAFA;--t2:#A1A1AA;--t3:#52525B;
  --green:#19964B;--lightgreen:#BCFF8B;--pink:#FFAFFF;--yellow:#FCED21;--orange:#FFA50A;--cyan:#00FFFF;--red:#FF2828;
  --ease:cubic-bezier(.4,0,.2,1);
  --head:"PP Neue Montreal","Inter Tight",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --body:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--body);color:var(--t1);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1080px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){#app{padding-left:24px;padding-right:24px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--lightgreen);outline-offset:2px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--head)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{height:44px;width:auto;color:var(--t1);flex:none}
.logo path{fill:currentColor}
.brand h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.brand p{margin:4px 0 0;color:var(--t2);font-size:13px}
.top-r{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:13px;color:var(--t2);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--lightgreen);box-shadow:0 0 0 3px rgba(188,255,139,.15)}
.status.warn i{background:var(--yellow);box-shadow:0 0 0 3px rgba(252,237,33,.15)}
@media (max-width:520px){.status{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:500;font-size:14px;white-space:nowrap;transition:background .2s var(--ease),border-color .2s var(--ease),opacity .2s var(--ease)}
.btn-primary{background:var(--t1);color:#0A0A0C}
.btn-primary:hover{background:#E4E4E7}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--t1)}
.btn-ghost:hover{background:var(--s2)}
.btn-danger{background:transparent;border-color:rgba(255,40,40,.5);color:#FF6B6B}
.btn-danger:hover{background:rgba(255,40,40,.12)}
.btn-danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:999px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:none;color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease)}
.iconbtn:hover{background:var(--s3);color:var(--t1)}
.iconbtn.danger:hover{color:#FF6B6B}

/* hero: next up */
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px}
.hero{position:relative;overflow:hidden;padding:28px 24px;margin-bottom:24px;min-height:248px;display:flex;flex-direction:column;justify-content:flex-end}
.hero__line{position:absolute;top:0;right:0;bottom:0;width:58%;height:100%;pointer-events:none}
.hero__line path{fill:none;stroke:var(--red);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.9}
.hero__body{position:relative;max-width:54%;display:flex;flex-direction:column;align-items:flex-start}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600}
.hero .lbl{color:var(--red)}
.hero h2{font-size:clamp(28px,5vw,44px);line-height:1.05;letter-spacing:-.02em;font-weight:700;margin:8px 0 12px;overflow-wrap:anywhere}
.hero .meta{color:var(--t2)}
.count{display:flex;align-items:baseline;gap:10px;margin-top:20px}
.num{font-family:var(--head);font-size:64px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;-webkit-background-clip:text;background-clip:text;color:transparent;background-image:linear-gradient(135deg,var(--pink),var(--red))}
.count .unit{color:var(--t2);font-size:14px}
@media (max-width:640px){
  .hero{padding:156px 20px 24px;min-height:0}
  .hero__line{left:0;bottom:auto;width:100%;height:150px}
  .hero__body{max-width:none}
  .num{font-size:56px}
}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--s1);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 18px;border-radius:999px;color:var(--t2);white-space:nowrap;font-size:14px;font-weight:500;transition:background .2s var(--ease),color .2s var(--ease)}
.tab:hover{color:var(--t1)}
.tab[aria-pressed="true"]{background:var(--s3);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2)}
.controls-r{display:flex;align-items:center;gap:16px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--lightgreen);margin:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--t2);white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.chip:hover{color:var(--t1)}
.chip[aria-pressed="true"]{background:var(--s3);color:var(--t1);border-color:var(--line2)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sep{width:1px;background:var(--line2);margin:4px 4px}

/* month strip */
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-bottom:24px}
.strip a{text-decoration:none;border-radius:10px;background:rgba(255,255,255,.025);padding:8px 2px;text-align:center;font-size:12px;font-weight:600;color:var(--t2);min-height:52px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .2s var(--ease)}
.strip a:hover{background:rgba(255,255,255,.06);color:var(--t1)}
.strip a.empty{opacity:.35;pointer-events:none}
.strip a.now{color:var(--lightgreen);box-shadow:inset 0 -2px 0 var(--lightgreen)}
.strip .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:38px}
.strip .dots i{width:6px;height:6px;border-radius:50%}
@media (max-width:640px){.strip{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* months + events */
.months{display:flex;flex-direction:column;gap:16px}
.month{padding:20px;scroll-margin-top:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.elist{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:16px;padding:12px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.ev.past{opacity:.5}
.ev.cxl{background:transparent;border-style:dashed}
.ev.cxl .title{text-decoration:line-through;color:var(--t2)}
.dt{width:56px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.dt b{font-family:var(--head);font-size:22px;line-height:1;font-weight:700}
.dt span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:3px;opacity:.85}
.title{font-weight:600;font-size:16px;line-height:1.3;margin:0 0 6px}
.info{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.n{color:var(--t2);background:rgba(255,255,255,.05)}
.pill.cancel{color:#FF6B6B;background:rgba(255,40,40,.12)}
.pill.tbc{color:var(--yellow);background:rgba(252,237,33,.1)}
.loc{display:inline-flex;align-items:center;height:24px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:0 8px;border-radius:7px}
.loc.cen{color:var(--pink);background:rgba(255,175,255,.12)}
.loc.air{color:var(--t2);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line2)}
.desc{color:var(--t2);font-size:13px;margin:6px 0 0;white-space:pre-line}
.desc a{color:var(--lightgreen)}
.ev-acts{display:flex;gap:6px}
@media (max-width:560px){
  .ev{grid-template-columns:48px minmax(0,1fr);gap:12px}
  .dt{width:48px;height:48px}
  .ev-acts{grid-column:2}
  .ev-acts .iconbtn{height:32px}
}
.empty-state{padding:40px 24px;text-align:center;color:var(--t2)}
.empty-state b{display:block;color:var(--t1);font-family:var(--head);font-size:18px;margin-bottom:4px}

/* editor dialog */
dialog{width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line2);border-radius:24px;background:var(--s1);color:var(--t1);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
.dlg{display:flex;flex-direction:column}
.dlg-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;background:var(--s1);border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.dlg-x{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:none;color:var(--t2)}
.dlg-x:hover{background:var(--s3);color:var(--t1)}
.dlg-b{padding:8px 24px 0}
.fs{border:0;margin:0;padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;min-width:0}
.fs:last-of-type{border-bottom:0}
.fs legend{float:left;grid-column:1/-1;padding:0;margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lightgreen);font-weight:600}
.fs legend+*{clear:both}
.full{grid-column:1/-1}
@media (max-width:340px){.fs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.dlg-h,.dlg-foot{padding-left:20px;padding-right:20px}.dlg-b{padding:4px 20px 0}.input[type=date],.input[type=time]{padding-left:12px;padding-right:6px}}
.field{display:flex;flex-direction:column;gap:8px;min-width:0;margin:0;padding:0;border:0}
.field>.lbl,.field>legend{font-size:12px;letter-spacing:0;text-transform:none;color:var(--t2);font-weight:500;padding:0}
.opt{color:var(--t3);font-weight:400}
.input,.textarea{display:block;width:100%;min-width:0;height:44px;padding:0 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--t1);font-size:15px;-webkit-appearance:none;appearance:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.input::placeholder,.textarea::placeholder{color:var(--t3)}
.textarea{height:auto;min-height:96px;padding:12px 14px;resize:none;line-height:1.45}
.input:hover,.textarea:hover{border-color:rgba(255,255,255,.22)}
.input:focus,.textarea:focus{border-color:rgba(188,255,139,.6);outline:none;box-shadow:0 0 0 3px rgba(188,255,139,.15)}
.input[type=date],.input[type=time]{padding-right:10px;line-height:42px;font-variant-numeric:tabular-nums}
/* Safari/iOS draw the value with their own centring and margins: pin it left and vertically centred like the other fields */
.input::-webkit-date-and-time-value{margin:0;text-align:left;line-height:42px;min-height:42px}
.input::-webkit-datetime-edit{padding:0}
.input::-webkit-datetime-edit-fields-wrapper{padding:0}
.input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.55;cursor:pointer;margin-left:8px;padding:4px;border-radius:6px}
.input::-webkit-calendar-picker-indicator:hover{opacity:.9;background-color:rgba(0,0,0,.2)}
/* choice pills (type / location / status) */
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.choice span:hover{color:var(--t1)}
.choice .dot{width:8px;height:8px;border-radius:50%;flex:none}
.choice input:checked+span{background:var(--s3);color:var(--t1);border-color:var(--t1)}
.choice input:focus-visible+span{outline:2px solid var(--lightgreen);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--s2);border:1px solid var(--line2);width:100%}
.seg .choice{flex:1;min-width:0}
.seg .choice span{width:100%;justify-content:center;height:34px;padding:0 10px;border:0;background:none}
.seg .choice input:checked+span{background:var(--s3);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2)}
.dlg-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 24px;background:var(--s1);border-top:1px solid var(--line)}
.dlg-foot .r{display:flex;gap:8px;margin-left:auto}
.err{color:#FF6B6B;font-size:13px;margin:0;padding:0 24px 12px}

/* birthdays */
.bdays{margin-top:32px;padding:20px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.bd{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 10px;border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.bd.today{border-color:rgba(255,175,255,.5);background:rgba(255,40,40,.12)}
.bd .avatar{color:var(--pink);background:rgba(255,40,40,.2)}
.bd .who{flex:1;min-width:0}
.bd .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd .when{color:var(--t2);font-size:12px;font-variant-numeric:tabular-nums}
.bd .when b{color:var(--pink);font-weight:600}
.bd .in::before{content:" · "}
.bd .iconbtn{border-color:transparent;height:30px;min-width:30px;padding:0 8px}
@media (max-width:560px){
  .bdays{padding:16px}
  .bgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .bd{gap:8px;padding:8px 4px 8px 8px}
  .bd .avatar{display:none}
  .bd .when span{display:block}
  .bd .in::before{content:none}
}

/* attendance (team events) */
.pill.go{color:var(--lightgreen);background:rgba(25,150,75,.22)}
.pill.no{color:#FF6B6B;background:rgba(255,40,40,.12)}
.dlg-sub{margin:4px 0 0;color:var(--t2);font-size:13px}
.seg .choice.yes input:checked+span{color:var(--lightgreen)}
.seg .choice.nope input:checked+span{color:#FF6B6B}
.rgroup{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.rgroup .lbl{margin-bottom:2px}
.rrow{display:flex;align-items:flex-start;gap:12px;padding:10px 8px 10px 10px;border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line2)}
.avatar.yes{color:var(--lightgreen);background:rgba(25,150,75,.22)}
.avatar.no{color:#FF6B6B;background:rgba(255,40,40,.12)}
.rrow .who{min-width:0;flex:1;padding-top:5px}
.rrow .nm{font-weight:600;font-size:14px;line-height:1.3}
.rrow .note{color:var(--t2);font-size:13px;margin-top:2px;white-space:pre-line;overflow-wrap:anywhere}
.rrow .dlg-x{width:30px;height:30px;border-color:transparent}
.rempty{grid-column:1/-1;color:var(--t3);font-size:13px;margin:0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--s3);border:1px solid var(--line2);font-size:14px;transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none;z-index:10}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* footer */
footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer strong{font-family:var(--head);font-size:20px;letter-spacing:-.01em}
footer small{color:var(--t3);font-size:12px}
</style>
</head>

<script type="module">
// ---------- config ----------
// Firebase project shared with the CFH Holiday Board; events live under /events.
const FIREBASE = {
  apiKey: "AIzaSyAlrPiHBTJY1zu9PyG1ApL2n3HrHNmM7vo",
  authDomain: "cfh-holiday-planning.firebaseapp.com",
  databaseURL: "https://cfh-holiday-planning-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cfh-holiday-planning",
  appId: "1:768605928338:web:eb4f9d529e01ab23845f4b",
};

// Event types. Colours follow the CFH fixed pairs: `c` is the readable accent on dark, `tint` the pair background.
const TYPES = {
  clinic:      {label:"Clinic",      c:"#00FFFF", tint:"rgba(0,0,255,.32)"},
  competition: {label:"Competition", c:"#FF2828", tint:"rgba(255,40,40,.16)"},
  hyrox:       {label:"HYROX",       c:"#FCED21", tint:"rgba(252,237,33,.12)"},
  special:     {label:"Special WOD", c:"#FFA50A", tint:"rgba(255,165,10,.14)"},
  social:      {label:"Social",      c:"#FAFAFA", tint:"rgba(255,255,255,.1)"},
  team:        {label:"Team",        c:"#BCFF8B", tint:"rgba(25,150,75,.28)"},
  birthday:    {label:"Birthday",    c:"#FFAFFF", tint:"rgba(255,40,40,.2)"},
  closed:      {label:"Box closed",  c:"#A1A1AA", tint:"rgba(255,255,255,.05)"},
};
const FALLBACK_TYPE = {label:"Event", c:"#E1E1E1", tint:"rgba(225,225,225,.08)"};
const LOCATIONS = {Central:"cen", Airport:"air"};
const FIELDS = ["title","date","end","time","endTime","type","location","status","link","description"];

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const today = new Date(); today.setHours(0,0,0,0);
const thisYear = today.getFullYear();
const YEARS = [thisYear, thisYear + 1];

const state = {year: thisYear, type: "", loc: "", showPast: false, events: [], raw: {}, rsvp: {}, birthdays: []};
let db = null;   // { ref, push, set, remove, ... } once Firebase is loaded

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const typeOf = e => TYPES[e.type] || FALLBACK_TYPE;
const endOf = e => e.end ? parseDate(e.end) : e.startDate;
const isPast = e => endOf(e) < today;
const fmtLong = d => WD[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const ICON_CAL = `<svg class="ic" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3M8 8.5v3M6.5 10h3"/></svg>`;
const ICON_EDIT = `<svg class="ic" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>`;
const ICON_PEOPLE = `<svg class="ic" viewBox="0 0 16 16"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2 2.3-3 4.5-3s3.9 1 4.5 3M10.5 3.2a2.5 2.5 0 010 4.6M12 10.7c1.2.4 2 1.4 2.5 2.8"/></svg>`;
const ICON_X = `<svg class="ic" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>`;
const ICON_LINK = `<svg class="ic" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3L7 9M11 9.5V13H3V5h3.5"/></svg>`;

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2400);
}

function setEvents(obj){
  state.loaded = true;
  state.raw = Object.fromEntries(Object.entries(obj || {}).filter(([, e]) => e.date && e.title).map(([id, e]) => [id, {...e, id}]));
  const all = Object.values(state.raw);
  state.birthdays = all.filter(e => e.type === "birthday");
  state.events = all.filter(e => e.type !== "birthday")
    .flatMap(e => e.repeat !== "yearly" ? [{...e, baseId: e.id}] : YEARS.map(y => {
      const dy = y - Number(e.date.slice(0,4));
      return {...e, baseId: e.id, id: e.id + "@" + y, date: y + e.date.slice(4),
              end: e.end && (Number(e.end.slice(0,4)) + dy) + e.end.slice(4)};
    }))
    .map(e => ({...e, startDate: parseDate(e.date)}))
    .sort((a,b) => a.startDate - b.startDate || (a.time || "").localeCompare(b.time || "") || a.title.localeCompare(b.title));
  const last = state.events.map(e => e.updated || "").sort().pop();
  $("#updated").textContent = last ? "Updated " + fmtLong(new Date(last)) + " " + new Date(last).getFullYear() : "";
  renderAll();
}

// ---------- render ----------
function visible(){
  return state.events.filter(e =>
    e.startDate.getFullYear() === state.year &&
    (!state.type || e.type === state.type) &&
    (!state.loc || e.location === state.loc) &&
    (state.showPast || state.year !== thisYear || !isPast(e))
  );
}

function renderControls(){
  $("#years").innerHTML = YEARS.map(y =>
    `<button class="tab" aria-pressed="${y===state.year}" data-year="${y}">${y}</button>`).join("");
  $("#pastToggle").hidden = state.year !== thisYear;

  const used = new Set(state.events.map(e => e.type));
  const types = Object.keys(TYPES).filter(t => used.has(t));
  const locs = Object.keys(LOCATIONS).filter(l => state.events.some(e => e.location === l));
  $("#filters").innerHTML =
    `<button class="chip" aria-pressed="${!state.type && !state.loc}" data-reset>All</button>` +
    types.map(t => `<button class="chip" aria-pressed="${state.type===t}" data-type="${t}"><span class="dot" style="background:${TYPES[t].c}"></span>${esc(TYPES[t].label)}</button>`).join("") +
    (locs.length ? `<span class="sep"></span>` + locs.map(l => `<button class="chip" aria-pressed="${state.loc===l}" data-loc="${l}">${l}</button>`).join("") : "");
}

function renderStrip(list){
  const byMonth = Array.from({length:12}, () => []);
  list.forEach(e => byMonth[e.startDate.getMonth()].push(e));
  $("#strip").innerHTML = byMonth.map((evs, m) => {
    const now = state.year === thisYear && m === today.getMonth();
    return `<a href="#m${m}" class="${evs.length ? "" : "empty"} ${now ? "now" : ""}">${MONTHS[m].slice(0,3)}
      <span class="dots">${evs.slice(0,8).map(e => `<i style="background:${typeOf(e).c}"></i>`).join("")}</span></a>`;
  }).join("");
}

// ---------- attendance ----------
// Team events (coach meetings, team outings) ask coaches to confirm. Answers live under /rsvp/<event id>/<name>.
const hasRsvp = e => e.type === "team";
const answers = id => Object.entries(state.rsvp[id] || {}).map(([key, a]) => ({...a, key})).sort((a,b) => a.name.localeCompare(b.name));
const nameKey = n => n.trim().toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const initials = n => n.trim().split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase();
function rsvpPills(e){
  const a = answers(e.id), yes = a.filter(x => x.status === "yes").length, no = a.length - yes;
  if (!a.length) return `<span class="pill n">No answers yet</span>`;
  return `<span class="pill go">${yes} joining</span>${no ? `<span class="pill no">${no} not joining</span>` : ""}`;
}

const rdlg = $("#rsvp"), rform = $("#rsvpForm");
let rsvpId = null;
function renderRsvpList(){
  const a = answers(rsvpId);
  const group = (st, label) => {
    const rows = a.filter(x => x.status === st);
    if (!rows.length) return "";
    return `<div class="rgroup"><span class="lbl">${label} · ${rows.length}</span>${rows.map(x => `
      <div class="rrow">
        <span class="avatar ${st}">${esc(initials(x.name))}</span>
        <div class="who"><div class="nm">${esc(x.name)}</div>${x.note ? `<div class="note">${esc(x.note)}</div>` : ""}</div>
        <button type="button" class="dlg-x" data-unrsvp="${esc(x.key)}" title="Remove answer" aria-label="Remove answer of ${esc(x.name)}">${ICON_X}</button>
      </div>`).join("")}</div>`;
  };
  $("#rsvpList").innerHTML = `<legend>Answers</legend>` +
    (a.length ? group("yes", "Joining") + group("no", "Not joining") : `<p class="rempty">Nobody has answered yet.</p>`);
}
function openRsvp(e){
  rsvpId = e.id;
  rform.reset();
  try { rform.name.value = localStorage.getItem("cfh-name") || ""; } catch {}
  const mine = rform.name.value && (state.rsvp[e.id] || {})[nameKey(rform.name.value)];
  if (mine){ rform.answer.value = mine.status; rform.note.value = mine.note || ""; }
  $("#rsvpTitle").textContent = e.title;
  $("#rsvpSub").textContent = fmtLong(e.startDate) + (e.time ? " · " + e.time : "") + (e.location ? " · " + e.location : "");
  $("#rsvpErr").hidden = true;
  renderRsvpList();
  rdlg.showModal();
  if (!rform.name.value) rform.name.focus();
}
rform.addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = rform.name.value.trim().replace(/\s+/g, " ");
  const key = nameKey(name);
  if (!key){ $("#rsvpErr").textContent = "Add your name."; $("#rsvpErr").hidden = false; return; }
  const answer = {name, status: rform.answer.value, at: new Date().toISOString()};
  const note = rform.note.value.trim(); if (note) answer.note = note;
  try {
    await db.set(db.ref(db.database, `rsvp/${rsvpId}/${key}`), answer);
    try { localStorage.setItem("cfh-name", name); } catch {}
    rdlg.close(); toast(answer.status === "yes" ? "See you there" : "Answer saved");
  } catch (err){ console.error(err); $("#rsvpErr").textContent = "Could not save. Check your connection and try again."; $("#rsvpErr").hidden = false; }
});
rdlg.addEventListener("click", async ev => {
  if (ev.target.closest("[data-close]")) return rdlg.close();
  const x = ev.target.closest("[data-unrsvp]");
  if (x){ try { await db.remove(db.ref(db.database, `rsvp/${rsvpId}/${x.dataset.unrsvp}`)); } catch (err){ console.error(err); toast("Could not remove"); } }
});
// Prefill the answer when a coach types a name that already answered.
rform.name.addEventListener("change", () => {
  const mine = (state.rsvp[rsvpId] || {})[nameKey(rform.name.value)];
  if (mine){ rform.answer.value = mine.status; rform.note.value = mine.note || ""; }
});

function eventRow(e){
  const t = typeOf(e);
  const cxl = e.status === "cancelled";
  const time = e.time ? e.time + (e.endTime ? "–" + e.endTime : "") : "";
  const range = e.end && e.end !== e.date ? "Until " + fmtLong(endOf(e)) : "";
  const link = safeUrl(e.link);
  return `<article class="ev ${isPast(e) ? "past" : ""} ${cxl ? "cxl" : ""}">
    <div class="dt" style="background:${t.tint};color:${t.c}"><b>${e.startDate.getDate()}</b><span>${WD[e.startDate.getDay()]}</span></div>
    <div>
      <h3 class="title">${esc(e.title)}</h3>
      <div class="info">
        <span class="pill" style="color:${t.c};background:${t.tint}">${esc(t.label)}</span>
        ${e.location ? `<span class="loc ${LOCATIONS[e.location] || "air"}">${esc(e.location)}</span>` : ""}
        ${time ? `<span class="pill n">${esc(time)}</span>` : ""}
        ${range ? `<span class="pill n">${esc(range)}</span>` : ""}
        ${cxl ? `<span class="pill cancel">Cancelled</span>` : ""}
        ${e.status === "tbc" ? `<span class="pill tbc">To be confirmed</span>` : ""}
        ${hasRsvp(e) ? rsvpPills(e) : ""}
      </div>
      ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ""}
    </div>
    <div class="ev-acts">
      ${link ? `<a class="iconbtn" href="${esc(link)}" target="_blank" rel="noopener" title="More info">${ICON_LINK}</a>` : ""}
      ${hasRsvp(e) && !cxl ? `<button class="iconbtn" data-rsvp="${esc(e.id)}" title="Confirm your attendance">${ICON_PEOPLE}RSVP</button>` : ""}
      ${cxl ? "" : `<button class="iconbtn" data-ics="${esc(e.id)}" title="Add to your calendar">${ICON_CAL}Add</button>`}
      <button class="iconbtn" data-edit="${esc(e.baseId)}" title="Edit event" aria-label="Edit ${esc(e.title)}">${ICON_EDIT}</button>
    </div>
  </article>`;
}

function renderList(list){
  if (!list.length){
    const filtered = state.type || state.loc;
    $("#list").innerHTML = `<div class="card empty-state"><b>No events ${filtered ? "match this filter" : "planned yet"}</b>${filtered ? "Try another filter." : `The ${state.year} calendar will appear here as soon as it is planned.`}</div>`;
    return;
  }
  const byMonth = new Map();
  list.forEach(e => { const m = e.startDate.getMonth(); if (!byMonth.has(m)) byMonth.set(m, []); byMonth.get(m).push(e); });
  $("#list").innerHTML = [...byMonth].map(([m, evs]) => `
    <section class="card month" id="m${m}">
      <div class="sec-h"><h2>${MONTHS[m]}</h2><span class="lbl">${evs.length} ${evs.length === 1 ? "event" : "events"}</span></div>
      <div class="elist">${evs.map(eventRow).join("")}</div>
    </section>`).join("");
}

function renderHero(){
  const upcoming = state.events.filter(e => !isPast(e) && e.status !== "cancelled");
  const next = upcoming[0];
  const st = $("#status");
  st.hidden = !upcoming.length;
  st.querySelector("span").textContent = upcoming.length + " upcoming";
  if (!next){ $("#hero").hidden = true; return; }
  const days = Math.round((next.startDate - today) / 864e5);
  const now = days <= 0;
  const t = typeOf(next);
  $("#hero").hidden = false;
  $("#heroBody").innerHTML = `
    <div>
      <div class="lbl">${now ? "Happening today" : "Next up"}</div>
      <h2>${esc(next.title)}</h2>
      <div class="info">
        <span class="pill" style="color:${t.c};background:${t.tint}">${esc(t.label)}</span>
        ${next.location ? `<span class="loc ${LOCATIONS[next.location] || "air"}">${esc(next.location)}</span>` : ""}
        <span class="meta">${fmtLong(next.startDate)}${next.time ? " · " + esc(next.time) : ""}</span>
      </div>
    </div>
    <div class="count">
      <div class="num">${now ? "Today" : days}</div>
      ${now ? "" : `<div class="unit">${days === 1 ? "day to go" : "days to go"}</div>`}
    </div>`;
}

function renderBirthdays(){
  const next = e => { const d = parseDate(thisYear + e.date.slice(4)); if (d < today) d.setFullYear(thisYear + 1); return d; };
  const list = state.birthdays.map(e => ({...e, nextDate: next(e)})).sort((a,b) => a.nextDate - b.nextDate);
  $("#bgrid").innerHTML = list.length ? list.map(e => {
    const days = Math.round((e.nextDate - today) / 864e5);
    const name = e.title.replace(/[’']s birthday$/i, "");
    return `<div class="bd ${days === 0 ? "today" : ""}">
      <span class="avatar">${esc(initials(name))}</span>
      <div class="who"><div class="nm">${esc(name)}</div>
        <div class="when"><span>${e.nextDate.getDate()} ${MONTHS[e.nextDate.getMonth()].slice(0,3)}</span><span class="in">${days === 0 ? "<b>Today</b>" : days === 1 ? "Tomorrow" : "in " + days + " days"}</span></div></div>
      <button class="iconbtn" data-edit="${esc(e.id)}" title="Edit birthday" aria-label="Edit ${esc(e.title)}">${ICON_EDIT}</button>
    </div>`;
  }).join("") : `<p class="rempty">No birthdays yet.</p>`;
}

function renderAll(){
  renderHero(); renderControls(); renderBirthdays();
  const list = visible();
  renderStrip(list); renderList(list);
}

// ---------- .ics export ----------
function ics(e){
  const pad = n => String(n).padStart(2,"0");
  const d = dt => dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate());
  const t = s => s.replace(":","") + "00";
  const icsEsc = s => String(s || "").replace(/\\/g,"\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g,"\\n");
  let when;
  if (e.time){
    const endTime = e.endTime || (() => { const [h,m] = e.time.split(":").map(Number); return pad(Math.min(h+1,23)) + ":" + pad(m); })();
    when = `DTSTART;TZID=Europe/Amsterdam:${d(e.startDate)}T${t(e.time)}\r\nDTEND;TZID=Europe/Amsterdam:${d(endOf(e))}T${t(endTime)}`;
  } else {
    const after = new Date(endOf(e)); after.setDate(after.getDate() + 1);
    when = `DTSTART;VALUE=DATE:${d(e.startDate)}\r\nDTEND;VALUE=DATE:${d(after)}`;
  }
  const body = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CFH//Events//EN","BEGIN:VEVENT",
    `UID:${e.id}@cfh-events`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
    when,
    e.repeat === "yearly" ? "RRULE:FREQ=YEARLY" : "",
    `SUMMARY:${icsEsc(e.title)}`,
    e.location ? `LOCATION:${icsEsc("CFH " + e.location)}` : "",
    e.description || e.link ? `DESCRIPTION:${icsEsc([e.description, safeUrl(e.link)].filter(Boolean).join("\n\n"))}` : "",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type:"text/calendar"}));
  a.download = e.title.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-") + ".ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- editor ----------
const dlg = $("#editor"), form = $("#form");
$("#typeChoices").innerHTML = Object.entries(TYPES).map(([k,v], i) =>
  `<label class="choice"><input type="radio" name="type" value="${k}" ${i ? "" : "checked"}><span><i class="dot" style="background:${v.c}"></i>${esc(v.label)}</span></label>`).join("");
let editingId = null;

function openEditor(e, preset){
  editingId = e ? e.id : null;
  form.reset();
  FIELDS.forEach(f => { if (form[f]) form[f].value = e ? (e[f] || "") : ""; });
  form.repeat.checked = !!e && e.repeat === "yearly";
  if (!e){ form.type.value = preset || "clinic"; form.date.value = ""; form.repeat.checked = preset === "birthday"; }
  $("#formTitle").textContent = e ? "Edit event" : "New event";
  $("#delBtn").hidden = !e;
  $("#delBtn").classList.remove("armed"); $("#delBtn").textContent = "Delete";
  $("#formErr").hidden = true;
  dlg.showModal();
  form.title.focus();
}

function formData(){
  const out = {};
  FIELDS.forEach(f => { const v = form[f].value.trim(); if (v) out[f] = v; });
  if (form.repeat.checked) out.repeat = "yearly";
  return out;
}

function validate(e){
  if (!e.title) return "Add a title.";
  if (!e.date) return "Pick a date.";
  if (e.end && e.end < e.date) return "The end date is before the start date.";
  if (e.link && !safeUrl(e.link)) return "The link must start with http:// or https://";
  return "";
}

async function guarded(fn, okMsg){
  const btns = form.querySelectorAll("button");
  btns.forEach(b => b.disabled = true);
  try { await fn(); dlg.close(); toast(okMsg); }
  catch (err){
    console.error(err);
    $("#formErr").textContent = "Could not save. Check your connection and try again.";
    $("#formErr").hidden = false;
  }
  finally { btns.forEach(b => b.disabled = false); }
}

form.addEventListener("submit", ev => {
  ev.preventDefault();
  const e = formData();
  const msg = validate(e);
  if (msg){ $("#formErr").textContent = msg; $("#formErr").hidden = false; return; }
  e.updated = new Date().toISOString();
  guarded(() => editingId
    ? db.set(db.ref(db.database, "events/" + editingId), e)
    : db.set(db.push(db.ref(db.database, "events")), e),
    editingId ? "Event updated" : "Event added");
});
$("#cancelBtn").addEventListener("click", () => dlg.close());
$("#closeBtn").addEventListener("click", () => dlg.close());
// Birthdays come back every year: tick "Repeats every year" when the type is picked for a new event.
$("#typeChoices").addEventListener("change", ev => { if (!editingId && ev.target.value === "birthday") form.repeat.checked = true; });
$("#delBtn").addEventListener("click", ev => {
  const b = ev.currentTarget;
  if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "Tap again to delete"; return; }
  guarded(() => Promise.all([
    db.remove(db.ref(db.database, "events/" + editingId)),
    db.remove(db.ref(db.database, "rsvp/" + editingId)),
  ]), "Event deleted");
});

// ---------- interactions ----------
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-year],[data-type],[data-loc],[data-reset],[data-ics],[data-edit],[data-rsvp]");
  if (!el) return;
  if (el.dataset.ics) return ics(state.events.find(e => e.id === el.dataset.ics));
  if (el.dataset.edit) return openEditor(state.raw[el.dataset.edit]);
  if (el.dataset.rsvp) return openRsvp(state.events.find(e => e.id === el.dataset.rsvp));
  if (el.dataset.year) state.year = Number(el.dataset.year);
  else if (el.dataset.type) state.type = state.type === el.dataset.type ? "" : el.dataset.type;
  else if (el.dataset.loc) state.loc = state.loc === el.dataset.loc ? "" : el.dataset.loc;
  else if ("reset" in el.dataset){ state.type = ""; state.loc = ""; }
  renderAll();
});
$("#showPast").addEventListener("change", ev => { state.showPast = ev.target.checked; renderAll(); });
$("#addBtn").addEventListener("click", () => openEditor(null));
$("#addBday").addEventListener("click", () => openEditor(null, "birthday"));
$("#subtitle").textContent = `What's coming up at CFH · ${YEARS[0]}–${YEARS[1]}`;

// ---------- data ----------
async function start(){
  try {
    const V = "10.12.2";
    const [{initializeApp}, D] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`),
    ]);
    db = {...D, database: D.getDatabase(initializeApp(FIREBASE))};
    D.onValue(D.ref(db.database, "events"), snap => setEvents(snap.val()), err => { console.error(err); showError(); });
    D.onValue(D.ref(db.database, "rsvp"), snap => {
      state.rsvp = snap.val() || {};
      if (state.loaded) renderAll();
      if (rdlg.open) renderRsvpList();
    }, err => console.error(err));
    $("#addBtn").disabled = false;
  } catch (err){ console.error(err); showError(); }
}
function showError(){
  $("#list").innerHTML = `<div class="card empty-state"><b>Events could not be loaded</b>Please refresh the page.</div>`;
}
start();
</script>
